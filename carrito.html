<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Huellas & Cia</title>
    <link rel="stylesheet" href="./css/tienda.css">
    <script src="./js/funciones.js" defer></script>
</head>

<body>
    <header>
        <a href="./" aria-label="Ir al inicio de Huellas y Cia">
            <img src="./recursos/imagenes/logo.png" alt="Logo Huellas y Cia">
        </a>
        <nav aria-label="Navegacion principal">
            <ul>
                <li><a href="./">Inicio</a></li>
                <li><a href="./tienda.html">Tienda</a></li>
                <li><a href="./turnos.html">Turnos</a></li>
                <li><a href="./nosotros.html">Nosotros</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./micuenta.html">Mi Cuenta</a></li>
            </ul>
        </nav>
        <div aria-label="Carrito de compras">
            <img src="./recursos/iconos/carrito.svg" width="30" alt="Icono carrito">
            <span>0</span>
        </div>
    </header>

    <main>
        <h1>Tu carrito</h1>

        <section aria-label="Contenido del carrito">
            <table id="tabla-carrito">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Items -->
                </tbody>
            </table>

            <div id="resumen-compra">
                <p>Subtotal: <span id="subtotal">$ 0</span></p>
                <a href="./tienda.html">Seguir comprando</a>
                <button id="vaciar-carrito">Vaciar carrito</button>
            </div>
        </section>
    </main>

    <footer>
        <div>
            <h4>Huellas & Cia</h4>
            <p>Cordoba, Argentina</p>
            <p>Tel: +54 351 000-0000</p>
            <p>contacto@huellas.com.ar</p>
        </div>
    </footer>
</body>

</html>
